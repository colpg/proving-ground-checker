# The checker's own test, on every push and pull request. It holds no secret.
#
# 1. A judge that cannot start must read as a FAULT, never as a rejection.
# 2. With the sandbox working, both controls must behave, every honest answer in the goal template
#    must be accepted, and every file in corpus/ must draw the finding the corpus names. Each answer
#    goes through the three steps the check workflow runs as three jobs: the challenge is built and
#    exported with no answer present, the answer is built and exported in the sandbox, and the
#    judge then sees only the two exports.
# 3. The same for a goal that needs Mathlib: its dependencies and their build cache come first.
# 4. How the judge's output is read, on the judge's own wording, for the readings that cannot be
#    produced on demand; the screen for files that run code; the check of a verdict's token; and
#    the check of a goal's dependencies. Each of these is a small table of cases.
#
# The corpus holds one file for each way a file can run code while it builds. Each must be refused
# by the screen, and each must be shown to run code with the screen off. It also holds an answer
# that fills the disk and one that takes all the memory, which must be rejections and not faults.
name: selftest

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: true

env:
  # The goal the corpus is written against, pinned to a commit.
  TEMPLATE_REPOSITORY: colpg/proving-ground-goal-template
  TEMPLATE_COMMIT: 7308cdb5edf6bc8b4b83048a9ea01c6b1223547c

jobs:
  broken-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Lean and the sandbox tool, and fix nothing
        env:
          PG_SKIP_SANDBOX_FIX: "1"
        run: bash judge/setup.sh 4.36.0
      - name: A judge that cannot start must read as a fault
        run: python3 judge/judge.py controls --expect-fault

  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Fetch the goal template at its pinned commit
        run: |
          set -euo pipefail
          git init -q goal
          git -C goal fetch -q --depth 1 "https://github.com/${TEMPLATE_REPOSITORY}.git" "$TEMPLATE_COMMIT"
          git -C goal checkout -q FETCH_HEAD
          test "$(git -C goal rev-parse HEAD)" = "$TEMPLATE_COMMIT"
      - name: Install the goal's Lean release and let the sandbox start
        run: bash judge/setup.sh goal
      - name: Honest answers accepted, and every corpus file read as the corpus says
        run: python3 judge/judge.py corpus --goal goal --corpus corpus/corpus.json

      - name: How the judge's output is read, and that added text never changes a reading
        run: python3 judge/test_classify.py
      - name: The screen for files that run code
        run: python3 judge/test_screen.py
      - name: The check of the token that vouches for a verdict
        run: python3 judge/test_verify_token.py
      - name: The check of a goal's dependencies
        run: python3 judge/test_deps.py

  mathlib:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the fixture's Lean release and let the sandbox start
        run: bash judge/setup.sh fixtures/mathlib-goal
      - name: Resolve Mathlib at the fixture's tag
        # The fixture carries no manifest; a real goal commits one and skips this step.
        run: cd fixtures/mathlib-goal && lake update && echo "=== lake-manifest.json" && cat lake-manifest.json
      - name: Bring in the dependencies and their build cache
        run: bash judge/deps.sh fixtures/mathlib-goal
      - name: The honest answer accepted, the dishonest ones refused
        run: python3 judge/judge.py corpus --goal fixtures/mathlib-goal --corpus fixtures/mathlib-corpus/corpus.json
