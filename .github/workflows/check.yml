# Judges ONE answer to one problem of one goal, on a machine that is thrown away afterwards.
#
# Started only by workflow_dispatch on the default branch, never by a pull request: so the workflow
# and the judge that run are the ones on the default branch. Every input is an identifier, a hash or
# an address. Each is matched against a pattern before it is used, and none is ever interpolated
# into a command: they travel as environment variables. The answer itself is fetched by address and
# compared with its hash; it is data until the judge's sandbox builds it.
#
# The job holds no secret and its token can only read this repository. Its one result is the file
# verdict.json, uploaded as the artifact `verdict`.
name: check
run-name: check ${{ inputs.submission }}

on:
  workflow_dispatch:
    inputs:
      submission:
        description: The identifier of the submission being judged
        required: true
        type: string
      goal_repository:
        description: The goal's public repository, as owner/name
        required: true
        type: string
      goal_commit:
        description: The goal's commit, 40 hex digits
        required: true
        type: string
      problem:
        description: The problem's identifier (for a cut, the cut's identifier)
        required: true
        type: string
      answer_kind:
        description: What the answer is
        required: true
        type: choice
        options: [proof, refutation, cut]
      answer_url:
        description: Where to fetch the answer, an https address on an allowed host
        required: true
        type: string
      answer_sha256:
        description: The SHA-256 of the answer, 64 hex digits
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: check-${{ inputs.submission }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SUBMISSION: ${{ inputs.submission }}
      PG_GOAL_REPOSITORY: ${{ inputs.goal_repository }}
      PG_GOAL_COMMIT: ${{ inputs.goal_commit }}
      PROBLEM: ${{ inputs.problem }}
      ANSWER_KIND: ${{ inputs.answer_kind }}
      ANSWER_URL: ${{ inputs.answer_url }}
      ANSWER_SHA256: ${{ inputs.answer_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Match every input against its pattern
        run: |
          set -euo pipefail
          [[ "$SUBMISSION" =~ ^[A-Za-z0-9_-]{1,64}$ ]] || { echo "submission"; exit 2; }
          [[ "$PG_GOAL_REPOSITORY" =~ ^[A-Za-z0-9_.-]{1,100}/[A-Za-z0-9_.-]{1,100}$ ]] || { echo "goal_repository"; exit 2; }
          [[ "$PG_GOAL_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "goal_commit"; exit 2; }
          [[ "$PROBLEM" =~ ^[a-z][a-z0-9_]{0,62}$ ]] || { echo "problem"; exit 2; }
          [[ "$ANSWER_KIND" =~ ^(proof|refutation|cut)$ ]] || { echo "answer_kind"; exit 2; }
          [[ "$ANSWER_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "answer_sha256"; exit 2; }
          python3 - <<'EOF'
          import os, sys, urllib.parse
          u = urllib.parse.urlsplit(os.environ["ANSWER_URL"])
          hosts = [l.strip() for l in open("allowed-answer-hosts.txt") if l.strip() and not l.startswith("#")]
          ok = u.scheme == "https" and u.hostname in hosts and not u.username and u.port in (None, 443) and len(os.environ["ANSWER_URL"]) <= 500
          sys.exit(0 if ok else "answer_url is not an https address on an allowed host")
          EOF

      - name: Fetch the goal at its commit
        run: |
          set -euo pipefail
          git init -q goal
          git -C goal fetch -q --depth 1 "https://github.com/${PG_GOAL_REPOSITORY}.git" "$PG_GOAL_COMMIT"
          git -C goal checkout -q FETCH_HEAD
          test "$(git -C goal rev-parse HEAD)" = "$PG_GOAL_COMMIT"

      - name: Install the goal's Lean release and let the sandbox start
        run: bash judge/setup.sh goal

      - name: Bring in the goal's dependencies and their build cache
        run: bash judge/deps.sh goal

      - name: Fetch the answer
        run: |
          set -euo pipefail
          curl -sSf --proto '=https' --max-redirs 0 --max-filesize 262144 --max-time 60 "$ANSWER_URL" -o "$RUNNER_TEMP/answer.lean"
          sha256sum "$RUNNER_TEMP/answer.lean"

      - name: Run the controls, then judge the answer
        run: |
          python3 judge/judge.py answer --goal goal --problem "$PROBLEM" --kind "$ANSWER_KIND" \
            --answer "$RUNNER_TEMP/answer.lean" --answer-sha256 "$ANSWER_SHA256" --submission "$SUBMISSION" > verdict.json
          python3 -c "import json; v = json.load(open('verdict.json')); print(v['outcome'], v['reason_code'], '|', v.get('message', ''))"

      - uses: actions/upload-artifact@v4
        with:
          name: verdict
          path: verdict.json
          retention-days: 30
