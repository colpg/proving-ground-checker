# Judges ONE answer to one problem of one goal, in three jobs on three machines that are thrown
# away afterwards.
#
#   challenge   is given the goal and never the answer. It builds the challenge and exports it.
#               The export's SHA-256 is the problem's fingerprint, and leaves as a job output.
#   answer      is given the goal and the answer. It builds the answer inside a sandbox with no
#               network and exports it. It is the only job that runs submitted code, and nothing
#               it says in the answer's favour is believed.
#   verdict     is given the two exports and nothing to build. It runs Lean's judge on them, and
#               writes verdict.json, the run's one result, with a token that vouches for it.
#
# Every job of a run can write the run's store of files, so a file's name proves nothing about who
# wrote it. Two things answer that. The challenge's hash reaches the verdict job as a job output,
# not through the store. And the verdict job alone may ask GitHub for an identity token; it asks
# for one whose audience is the SHA-256 of verdict.json, and hands it on as verdict.jwt. A consumer
# checks that token before it believes the verdict (judge/verify_token.py).
#
# Started only by workflow_dispatch, never by a pull request, so the workflow and the judge that
# run are those of the ref it was dispatched on. Every input is an identifier, a hash, an address
# or a number. Each is matched against a pattern before it is used, and none is ever interpolated
# into a command: they travel as environment variables. The answer itself is fetched by address
# and compared with its hash; it is data until the sandbox builds it.
#
# No job holds a secret, and the token can only read this repository. Every action is pinned by
# its full commit hash. Each job's time limit is above the sum of the limits inside it, so that an
# answer cannot run a job into its limit and turn a rejection into a fault.
name: check
run-name: check ${{ inputs.submission }}

on:
  workflow_dispatch:
    inputs:
      submission:
        description: The identifier of the submission being judged
        required: true
        type: string
      goal_repository:
        description: The goal's public repository, as owner/name
        required: true
        type: string
      goal_commit:
        description: The goal's commit, 40 hex digits
        required: true
        type: string
      problem:
        description: The problem's identifier (for a cut, the cut's identifier)
        required: true
        type: string
      answer_kind:
        description: What the answer is
        required: true
        type: choice
        options: [proof, refutation, cut]
      answer_url:
        description: Where to fetch the answer, an https address on an allowed host
        required: true
        type: string
      answer_sha256:
        description: The SHA-256 of the answer, 64 hex digits
        required: true
        type: string
      budget_seconds:
        description: Seconds the answer may take to build, and again to be checked (60 to 1500)
        required: false
        default: "900"
        type: string

permissions:
  contents: read

concurrency:
  group: check-${{ inputs.submission }}
  cancel-in-progress: false

env:
  SUBMISSION: ${{ inputs.submission }}
  PG_GOAL_REPOSITORY: ${{ inputs.goal_repository }}
  PG_GOAL_COMMIT: ${{ inputs.goal_commit }}
  PROBLEM: ${{ inputs.problem }}
  ANSWER_KIND: ${{ inputs.answer_kind }}
  ANSWER_URL: ${{ inputs.answer_url }}
  ANSWER_SHA256: ${{ inputs.answer_sha256 }}
  BUDGET: ${{ inputs.budget_seconds }}

jobs:
  challenge:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      fingerprint: ${{ steps.make.outputs.fingerprint }}
      plan: ${{ steps.make.outputs.plan }}
      toolchain: ${{ steps.make.outputs.toolchain }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Match every input against its pattern
        run: bash judge/inputs.sh
      - name: Fetch the goal at its commit
        run: bash judge/fetch_goal.sh
      - name: Install the goal's Lean release and let the sandbox start
        timeout-minutes: 8
        run: bash judge/setup.sh goal
      - name: Check the goal's dependencies against the allow-list, then bring them in with their build cache
        timeout-minutes: 15
        run: bash judge/deps.sh goal
      - name: Build the challenge and export it
        id: make
        run: python3 judge/judge.py challenge --goal goal --problem "$PROBLEM" --kind "$ANSWER_KIND" --out "$RUNNER_TEMP/challenge"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: challenge
          path: ${{ runner.temp }}/challenge/challenge.ndjson
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  answer:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Match every input against its pattern
        run: bash judge/inputs.sh
      - name: Fetch the goal at its commit
        run: bash judge/fetch_goal.sh
      - name: Install the goal's Lean release and let the sandbox start
        timeout-minutes: 8
        run: bash judge/setup.sh goal
      - name: Check the goal's dependencies against the allow-list, then bring them in with their build cache
        timeout-minutes: 15
        run: bash judge/deps.sh goal
      - name: Fetch the answer
        run: |
          set -euo pipefail
          curl -sSf --proto '=https' --max-redirs 0 --max-filesize 262144 --max-time 60 "$ANSWER_URL" -o "$RUNNER_TEMP/answer.lean"
          sha256sum "$RUNNER_TEMP/answer.lean"
      - name: Run the controls, build the answer in the sandbox, export it, run a control again
        run: |
          python3 judge/judge.py answer --goal goal --problem "$PROBLEM" --kind "$ANSWER_KIND" \
            --answer "$RUNNER_TEMP/answer.lean" --answer-sha256 "$ANSWER_SHA256" --budget "$BUDGET" --out "$RUNNER_TEMP/answer"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: answer
          path: ${{ runner.temp }}/answer
          if-no-files-found: error
          retention-days: 1

  verdict:
    needs: [challenge, answer]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The only job that may ask GitHub for an identity token.
    permissions:
      contents: read
      id-token: write
    env:
      # These three come from the challenge job as job outputs, not through the artifact store,
      # which a job that ran the answer could reach.
      FINGERPRINT: ${{ needs.challenge.outputs.fingerprint }}
      PLAN: ${{ needs.challenge.outputs.plan }}
      TOOLCHAIN: ${{ needs.challenge.outputs.toolchain }}
      JOBS: challenge=${{ needs.challenge.result }},answer=${{ needs.answer.result }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Match every input against its pattern
        run: bash judge/inputs.sh
      - name: Install the Lean release the challenge job used, and let the sandbox start
        if: ${{ needs.challenge.result == 'success' }}
        timeout-minutes: 8
        run: bash judge/setup.sh "$TOOLCHAIN"
      - name: Fetch the challenge's export
        if: ${{ needs.challenge.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: challenge
          path: ${{ runner.temp }}/challenge
      - name: Fetch the answer job's report and export
        if: ${{ needs.answer.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: answer
          path: ${{ runner.temp }}/answer
      - name: Run the controls, judge the two exports, run a control again
        run: |
          set -euo pipefail
          printf '%s' "$PLAN" > "$RUNNER_TEMP/plan.json"
          python3 judge/judge.py verdict --plan "$RUNNER_TEMP/plan.json" --fingerprint "$FINGERPRINT" \
            --challenge "$RUNNER_TEMP/challenge/challenge.ndjson" --answer-dir "$RUNNER_TEMP/answer" \
            --jobs "$JOBS" --submission "$SUBMISSION" --answer-sha256 "$ANSWER_SHA256" --budget "$BUDGET" > verdict.json
          python3 -c "import json; v = json.load(open('verdict.json')); print(v['outcome'], v['reason_code'], '|', v.get('message', ''))"
      - name: Ask GitHub for a token bound to this verdict
        run: |
          set -euo pipefail
          hash="$(sha256sum verdict.json | cut -d' ' -f1)"
          curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=proving-ground-verdict:sha256:${hash}" \
            | python3 -c 'import json, sys; sys.stdout.write(json.load(sys.stdin)["value"])' > verdict.jwt
          test -s verdict.jwt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verdict
          path: |
            verdict.json
            verdict.jwt
          if-no-files-found: error
          # It replaces anything another job put there under this name.
          overwrite: true
          retention-days: 30
